name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions: {}

jobs:
  quality:
    name: Format, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            integration/go.sum
            seedlingpgx/go.sum
      - name: Set up mise
        uses: jdx/mise-action@v5.2.1
        with:
          version: 2026.8.12
          install: true
          install_args: golangci-lint
          cache: false
      - name: Install Go tools
        run: go install tool
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  seedlingpgx-version:
    name: Check seedlingpgx parent version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check seedlingpgx requires the seedling release being cut
        run: bash scripts/check-seedlingpgx-parent-version.sh "$GITHUB_REF_NAME"

  integration:
    name: Integration test (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        db:
          - mysql
          - postgres
          - sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: integration/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            integration/go.sum
      - name: Install Go tools
        run: go install tool
      - name: Run ${{ matrix.db }} integration tests
        env:
          SEEDLING_INTEGRATION_REQUIRED: "1"
        run: make test-integration-${{ matrix.db }}

  goreleaser:
    needs:
      - quality
      - seedlingpgx-version
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.3
      - name: Test seedlingpgx release candidate from an empty consumer
        env:
          GONOSUMDB: github.com/mhiro2/seedling*
          GOPROXY: direct
        run: |
          candidate_root="$(mktemp -d)"
          trap 'rm -rf -- "${candidate_root:?}"' EXIT
          candidate_repo="${candidate_root}/seedling"
          git clone --no-local "$GITHUB_WORKSPACE" "$candidate_repo"
          git -C "$candidate_repo" tag --force "seedlingpgx/${GITHUB_REF_NAME}" "$GITHUB_SHA"
          git config --file "${candidate_root}/gitconfig" \
            url."file://${candidate_repo}".insteadOf \
            https://github.com/mhiro2/seedling
          GIT_ALLOW_PROTOCOL=file:https \
          GIT_CONFIG_GLOBAL="${candidate_root}/gitconfig" \
          GIT_CONFIG_NOSYSTEM=1 \
            bash scripts/smoke-seedlingpgx-consumer.sh "$GITHUB_REF_NAME"
      - name: Create/update draft release and upload assets
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  seedlingpgx:
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: seedlingpgx/go.mod
          cache: false
      - name: Publish matching seedlingpgx module tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="seedlingpgx/${GITHUB_REF_NAME}"
          remote_sha="$(
            git ls-remote --tags origin "refs/tags/${tag}" "refs/tags/${tag}^{}" |
              awk '/\^\{\}$/ { peeled = $1; next } { direct = $1 } END { print (peeled != "" ? peeled : direct) }'
          )"
          if [[ -n "$remote_sha" && "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "${tag} already points to ${remote_sha}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ -z "$remote_sha" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="$GITHUB_SHA"
          fi
      - name: Test released module from an empty consumer
        env:
          GOPROXY: direct
        run: bash scripts/smoke-seedlingpgx-consumer.sh "$GITHUB_REF_NAME"
      - name: Publish draft release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
